[project]
name = "blender-pose-mcp"
version = "0.1.0"
description = "Dedicated stdio MCP server for posing one existing Blender armature"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp"]

[project.scripts]
blender-pose-mcp = "blender_pose_mcp.server:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blender_pose_mcp*"]
